name: Validate public firmware release

on:
  push:
    branches: [main]
    paths:
      - "release/**"
      - "tools/check_public_release.py"
      - ".github/workflows/validate-public-release.yml"
  pull_request:
    paths:
      - "release/**"
      - "tools/check_public_release.py"
      - ".github/workflows/validate-public-release.yml"

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public package boundary
        run: |
          python tools/check_public_release.py release/LOSEHU132-bin-20260803-public
          python tools/check_public_release.py release/LOSEHU132-bin-20260820-final3-public
